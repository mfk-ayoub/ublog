# ─────────────────────────────────────────────────────────────
#  Prometheus alert rules
# ─────────────────────────────────────────────────────────────
groups:
  - name: container_alerts
    rules:
      # Alert when a container is down for more than 1 minute
      - alert: ContainerDown
        expr: absent(container_last_seen{name=~".+"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "Container {{ $labels.name }} has been down for more than 1 minute."

      # Alert when container CPU usage exceeds 80%
      - alert: ContainerHighCpuUsage
        expr: (rate(container_cpu_usage_seconds_total{name=~".+"}[5m])) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.name }}"
          description: "Container {{ $labels.name }} CPU usage is above 80% for more than 2 minutes."

      # Alert when container memory usage exceeds 80%
      - alert: ContainerHighMemoryUsage
        expr: (container_memory_usage_bytes{name=~".+"} / container_spec_memory_limit_bytes{name=~".+"}) * 100 > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.name }}"
          description: "Container {{ $labels.name }} memory usage is above 80% for more than 2 minutes."

      # Alert when container restarts more than 3 times in 15 minutes
      - alert: ContainerFrequentRestarts
        expr: increase(container_restart_count{name=~".+"}[15m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Frequent restarts on {{ $labels.name }}"
          description: "Container {{ $labels.name }} has restarted more than 3 times in the last 15 minutes."
