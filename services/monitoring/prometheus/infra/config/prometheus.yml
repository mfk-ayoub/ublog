# ─────────────────────────────────────────────────────────────
#  Prometheus configuration
# ─────────────────────────────────────────────────────────────
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# ── Alertmanager ──────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ── Recording / alerting rules ────────────────────────────────
rule_files:
  - /etc/prometheus/alert_rules.yml

# ── Scrape targets ────────────────────────────────────────────
scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # cAdvisor – container metrics
  - job_name: "cadvisor"
    scrape_interval: 10s
    static_configs:
      - targets: ["cadvisor:8080"]

